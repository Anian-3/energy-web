name: Supabase 心跳

"on":
  schedule:
    - cron: '17 1,9,17 * * *'
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 查询一次数据库（保活动作）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "缺少 Secrets"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/records?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          head -c 200 /tmp/resp.txt; echo
          if [ "$code" != "200" ]; then
            echo "心跳失败：期望 200，实际 $code"
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "→ 多半是还没执行：grant select on public.records to anon;"
            fi
            exit 1
          fi
          echo "✅ 心跳成功"

      - name: 取出仓库
        if: github.event.schedule == '23 2 1 * *'
        uses: actions/checkout@v4

      - name: 更新时间戳（每月一次，防止定时任务被停用）
        if: github.event.schedule == '23 2 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "heartbeat-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: heartbeat $(date -u +%F)"
            git push
          fi
